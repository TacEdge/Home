# Local Postgres for development and integration tests. Not used in production.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: home
      POSTGRES_PASSWORD: home
      POSTGRES_DB: home
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U home -d home']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
