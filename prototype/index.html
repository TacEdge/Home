<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HOME — prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Prototype-only control. Not part of HOME. -->
  <div class="proto-bar" id="proto-bar">
    <span class="proto-label">prototype · fixture family only</span>
    <label class="proto-select">Scenario
      <select id="scenario"></select>
    </label>
    <span class="proto-hint">keys 1–6 switch · P phone width</span>
  </div>

  <div class="shell" id="shell">
    <nav class="rail" id="rail" aria-label="Places"></nav>

    <main class="place" id="place">
      <header class="top">
        <button class="menu-btn" id="menu-btn" aria-label="Places">⌂</button>
        <div class="switch" id="switch"></div>
        <span class="top-spacer"></span>
      </header>
      <section class="content" id="content"></section>
    </main>

    <aside class="kev" id="kev" aria-label="Kev">
      <div class="kev-handle" id="kev-handle"><span></span></div>
      <div class="kev-body" id="kev-body">
        <div class="kev-focus" id="kev-focus" hidden></div>
        <div class="kev-thread" id="kev-thread"></div>
        <div class="kev-suggest" id="kev-suggest"></div>
      </div>
      <form class="kev-input" id="kev-form" autocomplete="off">
        <input id="kev-text" type="text" placeholder="Ask or tell Kev…" aria-label="Ask or tell Kev" />
        <button type="submit" aria-label="Send">↑</button>
      </form>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="menu" id="menu" hidden>
      <div class="menu-title">Places</div>
      <ul id="menu-list"></ul>
    </div>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-handle"><span></span></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <script src="fixtures.js"></script>
  <script src="kev.js"></script>
  <script src="app.js"></script>
</body>
</html>
