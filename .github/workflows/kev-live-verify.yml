name: Kev live verification

# The M8 controlled live verification (docs/m8/M8-LIVE-VERIFICATION-PLAN.md;
# owner decisions 2-4, 2026-10-16; runbook docs/runbooks/KEV-LIVE-VERIFY.md).
# On demand only, from main, never on a push, pull request or schedule.
#
#   plan  holds no key and no database: the plan's hash must equal the
#         approved one, the budget must hold the plan's computed maximum and
#         be at most US$10, and the campaign ledger must hold the budget.
#   run   waits for the owner's approval (the `kev-evals` environment's
#         required reviewer), then runs the approved probes against the
#         job's own throwaway Postgres, seeded with the fixture family only.
#         The evaluation key is the `kev-evals` environment's own secret,
#         KEV_EVAL_PROVIDER_KEY, given to the one step that needs it. The
#         report (tokens, cost, stop reasons, inference geo and request ids;
#         never a prompt, answer or key) is the run's artifact.
#
# Every action is pinned to a commit SHA (version in the trailing comment);
# Dependabot keeps the pins current and tests/unit/workflows.test.ts enforces it.

on:
  workflow_dispatch:
    inputs:
      plan_hash:
        description: The approved plan hash (from the dry run, node scripts/kev-live/run.mts)
        required: true
        type: string
      budget_usd:
        description: The approved budget in US dollars, at most 10 (owner decision 4)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kev-live-verify
  cancel-in-progress: false

jobs:
  plan:
    name: Plan and budget check (no key)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the plan hash, the budget and the campaign ledger
        env:
          KEV_LIVE_APPROVED_PLAN_HASH: ${{ inputs.plan_hash }}
          KEV_LIVE_BUDGET_USD: ${{ inputs.budget_usd }}
        run: node scripts/kev-live/run.mts --check-plan

  run:
    name: Live verification (owner-approved)
    needs: plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: kev-evals
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: home
          POSTGRES_PASSWORD: home
          POSTGRES_DB: home_live_verify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U home -d home_live_verify"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The job's own throwaway database (owner decision 3): never home-dev or Production.
      ADMIN_DATABASE_URL: postgres://home:home@localhost:5432/home_live_verify
      DATABASE_URL: postgres://home_app:home_app@localhost:5432/home_live_verify
      BETTER_AUTH_URL: http://localhost:3000
      HOME_ALLOWED_EMAILS: sam@example.test,alex@example.test
      HOME_MAIL_TRANSPORT: test
      HOME_TIMEZONE: Pacific/Auckland
      NEXT_TELEMETRY_DISABLED: '1'
      KEV_LIVE_REPORT_DIR: kev-live-report
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Synthetic secrets for this job only (never stored)
        run: |
          echo "::add-mask::$(openssl rand -hex 32 | tee /tmp/auth)"
          echo "::add-mask::$(openssl rand -hex 32 | tee /tmp/audit)"
          echo "BETTER_AUTH_SECRET=$(cat /tmp/auth)" >> "$GITHUB_ENV"
          echo "AUDIT_HASH_SECRET=$(cat /tmp/audit)" >> "$GITHUB_ENV"
          rm -f /tmp/auth /tmp/audit
      - name: Create the runtime/app role (same role model as production)
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-app-role.sql
      - name: Apply the migrations to the job's database
        env:
          DATABASE_URL_MIGRATE: ${{ env.ADMIN_DATABASE_URL }}
        run: pnpm exec drizzle-kit migrate
      - name: Seed the fixture family (its own guard allows a local database only)
        run: pnpm db:seed:fixtures
      - name: Run the approved plan
        env:
          KEV_LIVE_APPROVED_PLAN_HASH: ${{ inputs.plan_hash }}
          KEV_LIVE_BUDGET_USD: ${{ inputs.budget_usd }}
          KEV_EVAL_PROVIDER_KEY: ${{ secrets.KEV_EVAL_PROVIDER_KEY }}
        run: node scripts/kev-live/run.mts --live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kev-live-report
          path: kev-live-report/
          if-no-files-found: warn
          retention-days: 30
