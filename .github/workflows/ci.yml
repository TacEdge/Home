name: CI

# Every action is pinned to a commit SHA (version in the trailing comment);
# Dependabot keeps the pins current and tests/unit/workflows.test.ts enforces it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Lint, typecheck, unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: home
          POSTGRES_PASSWORD: home
          POSTGRES_DB: home_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U home -d home_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://home:home@localhost:5432/home_test
      TEST_APP_DATABASE_URL: postgres://home_app:home_app@localhost:5432/home_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the runtime/app role (same role model as production)
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-app-role.sql
      - run: pnpm check:private-terms
        env:
          HOME_PRIVATE_TERMS: ${{ secrets.HOME_PRIVATE_TERMS }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: A misconfigured server fails at boot (contract §2.6)
        run: node scripts/check-boot-validation.mjs "$TEST_APP_DATABASE_URL"

  bundle:
    # What Vercel uploads (the repository minus .vercelignore) must build on
    # its own (M1.1 contract §1.2, B2). The script does its own install.
    name: Vercel bundle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: node scripts/vercel-bundle-check.mjs

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: home
          POSTGRES_PASSWORD: home
          POSTGRES_DB: home_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U home -d home_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://home:home@localhost:5432/home_test
      TEST_APP_DATABASE_URL: postgres://home_app:home_app@localhost:5432/home_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the runtime/app role (same role model as production)
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-app-role.sql
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
