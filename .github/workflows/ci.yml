name: CI

# Every action is pinned to a commit SHA (version in the trailing comment);
# Dependabot keeps the pins current and tests/unit/workflows.test.ts enforces it.

# Risk-based browser verification (ADR 0010): every job always runs and
# always reports, so the required checks never go missing or turn green by
# being skipped. The browser job decides how much to run from the risk tier
# of the change (scripts/ci-select.mts); pushes to main, the nightly run and
# manual runs are always full regression.
on:
  pull_request:
    # labeled/unlabeled: adding `ci:full` re-runs with full regression.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: '23 14 * * *' # nightly full regression on main (about 03:23 in Auckland)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event, so the nightly run never cancels a push to main (or the reverse).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    name: Lint, typecheck, unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: home
          POSTGRES_PASSWORD: home
          POSTGRES_DB: home_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U home -d home_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://home:home@localhost:5432/home_test
      TEST_APP_DATABASE_URL: postgres://home_app:home_app@localhost:5432/home_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the previous-schema check reads the base's migrations.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the runtime/app role (same role model as production)
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-app-role.sql
      - run: pnpm check:private-terms
        env:
          HOME_PRIVATE_TERMS: ${{ secrets.HOME_PRIVATE_TERMS }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: A misconfigured server fails at boot (contract §2.6)
        run: node scripts/check-boot-validation.mjs "$TEST_APP_DATABASE_URL"
      - name: The production CSP, nonce per response (M4 Package 1)
        run: node scripts/check-csp.mts "$TEST_APP_DATABASE_URL"
      # Migration-first (M2 contract §2.1, ADR 0005 §16): this code must work
      # on the schema production has before this change's migrations run.
      # Runs after the suites above; it rebuilds the test database from the
      # base's migrations and leaves it there.
      - name: Previous-schema compatibility (code runs on the base's schema)
        run: node scripts/check-previous-schema.mts --boot
      - name: Previous-schema check self-test (it fails when schema is missing)
        run: node scripts/check-previous-schema.mts --self-test

  bundle:
    # What Vercel uploads (the repository minus .vercelignore) must build on
    # its own (M1.1 contract §1.2, B2). The script does its own install.
    name: Vercel bundle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: node scripts/vercel-bundle-check.mjs

  e2e:
    # The required check `End-to-end (Playwright)`. It never waits for the
    # checks job and is never skipped at the job level: it always runs, picks
    # its scope from the risk tier, and fails if the classifier fails or
    # gives no recognisable answer. Tests run with one worker against this
    # job's own database (playwright.config.ts), never in parallel on one.
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: home
          POSTGRES_PASSWORD: home
          POSTGRES_DB: home_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U home -d home_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://home:home@localhost:5432/home_test
      TEST_APP_DATABASE_URL: postgres://home_app:home_app@localhost:5432/home_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The classifier diffs the pull request against the base it targets.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Select browser tests by risk tier
        id: select
        run: node scripts/ci-select.mts --ci
      - name: Refuse an unrecognised selection
        if: >-
          steps.select.outputs.mode != 'none' &&
          steps.select.outputs.mode != 'targeted' &&
          steps.select.outputs.mode != 'full'
        run: |
          echo "::error::the risk classifier gave no recognisable mode; refusing to pass"
          exit 1
      - name: No browser tests needed (low risk)
        if: steps.select.outputs.mode == 'none'
        run: echo "Low-risk change (see the summary); lint, unit, integration and build run in the checks job."
      - if: steps.select.outputs.mode == 'targeted' || steps.select.outputs.mode == 'full'
        run: pnpm install --frozen-lockfile
      - name: Create the runtime/app role (same role model as production)
        if: steps.select.outputs.mode == 'targeted' || steps.select.outputs.mode == 'full'
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-app-role.sql
      - if: steps.select.outputs.mode == 'targeted' || steps.select.outputs.mode == 'full'
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests, full regression
        if: steps.select.outputs.mode == 'full'
        run: pnpm test:e2e
      - name: Browser tests, selected specs and the smoke suite
        if: steps.select.outputs.mode == 'targeted'
        env:
          # Spec paths the classifier checked exist (letters, digits, hyphens).
          SPECS: ${{ steps.select.outputs.specs }}
        run: pnpm exec playwright test $SPECS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
